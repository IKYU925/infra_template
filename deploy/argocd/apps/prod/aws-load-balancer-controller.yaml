# Traefik Service(type LoadBalancer)를 NLB 로 만들어 준다. IAM 권한은 Terraform 의 Pod Identity.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.6.2
    helm:
      valuesObject:
        clusterName: myproject-prod # terraform output -raw cluster_name
        region: ap-northeast-2
        vpcId: CHANGE_ME # terraform output -raw vpc_id (노드 IMDS hop 제한 때문에 직접 넣는다)
        serviceAccount:
          name: aws-load-balancer-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
