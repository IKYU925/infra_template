# 공통 기본값. 환경별 차이는 values-local.yaml / values-dev.yaml / values-prod.yaml 에만 둔다.
#   local : helm upgrade --install app deploy/charts/app -n app -f deploy/charts/app/values-local.yaml
#   dev   : Argo CD 가 values-dev.yaml 로 배포 (deploy/argocd/apps/dev/app.yaml)

replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.29-alpine"
  pullPolicy: IfNotPresent

containerPort: 8080

# 앱이 받는 환경 변수 (DATABASE_URL 은 아래 database 설정이 Secret 으로 넣어 준다)
env: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

probes:
  path: /
  initialDelaySeconds: 5

serviceAccount:
  # Terraform 의 app_pod_identity 가 app 네임스페이스의 이 서비스 계정에 AWS 권한(S3)을 연결한다
  name: app

service:
  port: 80

ingress:
  enabled: true
  className: traefik
  # 비우면 모든 호스트 이름을 받는다 (로컬)
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: app-tls

# DATABASE_URL 이 들어 있는 Secret
database:
  secretName: app-db
  # local    : make local-deploy 가 local/.env 로 Secret 을 만든다
  # external : External Secrets Operator 가 Secrets Manager(RDS 마스터 비밀번호)로 Secret 을 만든다
  source: local
  external:
    # ClusterSecretStore 이름 (deploy/platform)
    store: aws-secrets-manager
    # Secrets Manager ARN: terraform output -raw db_master_secret_arn
    remoteKey: ""
    # terraform output db_address
    host: ""
    port: 5432
    name: app
    refreshInterval: 1h

# 클러스터 안 Postgres (로컬 전용. dev/prod 는 RDS)
postgresql:
  enabled: false
  image: postgres:17-alpine
  storageSize: 2Gi
  database: app
  username: app

networkPolicy:
  enabled: true
  # Ingress 컨트롤러(Traefik)가 있는 네임스페이스. k3s 는 kube-system, EKS 는 traefik
  ingressNamespace: traefik
