{{- if eq .Values.database.source "external" }}
{{- $db := .Values.database.external }}
# RDS 마스터 비밀번호(Secrets Manager, JSON: username/password)를 읽어 DATABASE_URL 을 만든다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $db.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $db.store }}
  target:
    name: {{ .Values.database.secretName }}
    template:
      data:
        DATABASE_URL: {{ printf "postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@%s:%v/%s?sslmode=require" (required "database.external.host 가 필요합니다" $db.host) $db.port $db.name | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "database.external.remoteKey 가 필요합니다" $db.remoteKey | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $db.remoteKey | quote }}
        property: password
{{- end }}
