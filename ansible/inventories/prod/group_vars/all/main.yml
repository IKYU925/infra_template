env_name: prod

# SSM Session Manager 로 접속 (22번 포트 닫혀 있음)
ansible_connection: amazon.aws.aws_ssm
ansible_aws_ssm_region: ap-northeast-2
# terraform -chdir=terraform/envs/prod output -raw artifact_bucket_name
ansible_aws_ssm_bucket_name: CHANGE_ME-prod-artifacts-ACCOUNT_ID
ansible_aws_ssm_bucket_sse_mode: "aws:kms"
ansible_python_interpreter: /usr/bin/python3

apply_os_hardening: true
apply_ssh_hardening: true
install_docker: true

app_name: sample-app
app_image: nginxinc/nginx-unprivileged:1.29-alpine
app_port: 8080
