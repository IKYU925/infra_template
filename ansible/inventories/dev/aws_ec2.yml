# 동적 인벤토리: Terraform 이 붙인 태그로 EC2 를 찾는다.
#   ansible-inventory -i inventories/dev --graph
plugin: amazon.aws.aws_ec2
regions:
  - ap-northeast-2
filters:
  tag:Project: myproject
  tag:Environment: dev
  instance-state-name: running
# Role 태그 값으로 그룹 생성 (예: Role=app -> 그룹 app)
keyed_groups:
  - key: tags.Role
    separator: ""
hostnames:
  - instance-id
compose:
  # SSM 접속은 instance-id 로 한다 (SSH/퍼블릭 IP 불필요)
  ansible_host: instance_id
