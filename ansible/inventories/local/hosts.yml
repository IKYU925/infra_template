# 로컬 Vagrant k3s 클러스터 (local/vagrant/Vagrantfile 과 IP 를 맞춘다)
#   컨트롤 플레인 1대 + 워커 2대
#
# 각 VM 이 자기 자신에게 Ansible 을 실행한다 (Vagrant ansible_local, connection=local).
# 그래서 노트북 OS(macOS/Windows)와 상관없이 같은 방식으로 동작한다.
all:
  vars:
    ansible_connection: local
  children:
    k3s_cluster:
      children:
        k3s_server:
          hosts:
            local-cp-01:
              k3s_node_ip: 192.168.56.10
        k3s_agent:
          hosts:
            local-worker-01:
              k3s_node_ip: 192.168.56.11
            local-worker-02:
              k3s_node_ip: 192.168.56.12
