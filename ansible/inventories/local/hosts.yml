# 로컬 실습용 인벤토리.
# local/docker-compose.yml 의 "ansible-lab" 프로필로 띄운 Ubuntu 컨테이너를 대상으로 한다.
#   docker compose -f local/docker-compose.yml --profile ansible-lab up -d
all:
  children:
    app:
      hosts:
        local-app-01:
          ansible_connection: community.docker.docker
          ansible_host: infra-local-ansible-target
