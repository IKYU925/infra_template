---
k3s_service_name: "{{ 'k3s' if k3s_role == 'server' else 'k3s-agent' }}"
k3s_arch: "{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"
k3s_binary_name: "{{ 'k3s-arm64' if k3s_arch == 'arm64' else 'k3s' }}"
k3s_release_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}"
