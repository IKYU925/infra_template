name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "apply 할 환경"
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.1"
  TFLINT_VERSION: "v0.65.0"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff terraform

  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [bootstrap, envs/local, envs/dev, envs/prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: terraform init (no backend)
        working-directory: terraform/${{ matrix.dir }}
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: terraform/${{ matrix.dir }}
        run: terraform validate -no-color
      - name: tflint
        working-directory: terraform/${{ matrix.dir }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/terraform/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/terraform/.tflint.hcl" --recursive --format compact

  plan:
    name: plan (${{ matrix.env }})
    needs: [fmt, validate]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    # 변수 AWS_PLAN_ROLE_ARN 은 GitHub Environment "<env>-plan" 에 등록 (승인 규칙 없음)
    environment: ${{ matrix.env }}-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip if AWS role is not configured
        id: guard
        run: |
          if [ -z "${{ vars.AWS_PLAN_ROLE_ARN }}" ]; then
            echo "::notice::AWS_PLAN_ROLE_ARN 이 없어 ${{ matrix.env }} plan 을 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.guard.outputs.skip != 'true'
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init
        if: steps.guard.outputs.skip != 'true'
        run: terraform init -input=false -backend-config=backend.hcl
      - name: terraform plan
        if: steps.guard.outputs.skip != 'true'
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
      - name: Write plan to job summary
        if: steps.guard.outputs.skip != 'true' && always()
        run: |
          {
            echo "### terraform plan: ${{ matrix.env }}"
            echo '```'
            tail -c 60000 plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply (${{ github.event.inputs.environment || 'dev' }})
    needs: [fmt, validate]
    # main 병합 시 dev 자동 apply, prod 는 수동 실행 + Environment 승인
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip if AWS role is not configured
        id: guard
        run: |
          if [ -z "${{ vars.AWS_APPLY_ROLE_ARN }}" ]; then
            echo "::notice::AWS_APPLY_ROLE_ARN 이 없어 apply 를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.guard.outputs.skip != 'true'
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - if: steps.guard.outputs.skip != 'true'
        run: terraform init -input=false -backend-config=backend.hcl
      - if: steps.guard.outputs.skip != 'true'
        run: terraform apply -input=false -auto-approve -lock-timeout=5m
