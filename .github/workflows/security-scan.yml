name: security-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: trivy (IaC misconfig + secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # upload-sarif 가 워크플로 실행 정보를 읽는 데 필요
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy config/secret scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          trivy-config: trivy.yaml
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      # 비공개 저장소는 GitHub Code Security(유료)가 없으면 업로드가 실패하므로 빌드를 막지 않는다.
      # 결과는 아래 아티팩트(sarif 파일)로 항상 받을 수 있다.
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Save Trivy SARIF as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: ignore
      - name: Trivy gate (HIGH/CRITICAL fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

  checkov:
    name: checkov (terraform, ansible, gha, compose)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # upload-sarif 가 워크플로 실행 정보를 읽는 데 필요
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkov
        uses: bridgecrewio/checkov-action@c10e2438743528f9e4549758fad8b7a62052541d # v12.3136.0
        with:
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      # 비공개 저장소는 GitHub Code Security(유료)가 없으면 업로드가 실패하므로 빌드를 막지 않는다.
      # 결과는 아래 아티팩트(sarif 파일)로 항상 받을 수 있다.
      - name: Upload Checkov results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov.sarif
          category: checkov
      - name: Save Checkov SARIF as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checkov-sarif
          path: checkov.sarif
          if-no-files-found: ignore
