# 고정한 버전을 자동으로 올려주는 PR 을 만든다 (Terraform 모듈/프로바이더, GitHub Actions, pip)
version: 2
updates:
  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/modules/platform
      - /terraform/envs/local
      - /terraform/envs/dev
      - /terraform/envs/prod
    schedule:
      interval: weekly
    groups:
      terraform-aws-modules:
        patterns: ["terraform-aws-modules/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /local
    schedule:
      interval: weekly
